# second-shift evidence — emitted (on request) into a consumer repo by
# /second-shift:onboard (#33). Runs the committed check script, which verifies a PR
# hasn't left the second-shift pin half-upgraded:
#   (a) config-lint the committed config with the linter shipped at the pinned ref;
#   (b) settings ref <-> lockfile ref lockstep.
#
# This workflow only REPORTS a check. To BLOCK merges on drift, mark the
# "second-shift evidence" check a required status check in this repo's branch
# protection rules — a committed workflow cannot require itself.
#
# Model-free: no API-billed model calls, just jq + gh (both preinstalled on
# ubuntu-latest; gh authenticates via the built-in github.token).
name: second-shift evidence
on:
  pull_request:
  workflow_dispatch:

# A `permissions:` key REPLACES the defaults wholesale — every scope not listed below is
# `none`, and GitHub documents no public-repo exception — so each arm's reads must be stated
# here or they are denied at runtime:
#   contents:               checkout, and the pinned-ref fetch of the check scripts.
#   issues + pull-requests: the lean evidence arm reads THIS PR's comment trail
#                           (GET /repos/{owner}/{repo}/issues/{number}/comments) for the build
#                           run's bot marker. Without them that read is denied, the payload
#                           reports an environment error, and every lean PR reds with a message
#                           pointing at the step env rather than at the token.
# What this block caps is WRITE, not read: the check executes a script fetched from the
# marketplace repo at the pinned ref, so the token this job holds is the blast radius if that
# repo is ever compromised. A read scope an arm requires belongs here; never grant a write one.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  evidence:
    name: second-shift evidence
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing for the lean-evidence check, not hygiene. That check
      # recomputes the branch's patch identity from merge-base(base, head), which a depth-1
      # checkout cannot resolve — and an unresolvable identity is reported as a failure, not
      # waved through, so a shallow checkout reds every lean PR rather than silently exempting
      # one. Ordinary PRs are unaffected either way.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: second-shift evidence checks (config-lint @ pinned ref + ref lockstep + lean evidence)
        # The PR context rides in the ENVIRONMENT, never interpolated into the run line: a PR
        # body is attacker-controllable, and `${{ }}` splicing into a shell command is
        # injectable. PR_HEAD_SHA must be the HEAD COMMIT and not `HEAD` — on a pull_request
        # event actions/checkout resolves refs/pull/N/merge, so HEAD is merge(base, head) and
        # every base-side commit since the branch point would read as a post-review change.
        # On workflow_dispatch these are all empty and the lean check reports not-applicable.
        #
        # PR_CREATED_AT is the cutoff every `since:`-bearing evidence arm compares itself
        # against: an arm whose contract took effect after this PR opened declines instead of
        # enforcing against a build session that finished before the contract existed. The
        # payload treats it as OPTIONAL — a workflow predating this line is not red, its lean
        # PRs just take the declining path — so adding it here is what restores full strength.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: bash .claude/tools/second-shift-ci-check.sh
