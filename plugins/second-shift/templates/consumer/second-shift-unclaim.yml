# second-shift unclaim — emitted (on request) into a consumer repo by
# /second-shift:onboard (#423). Releases the pipeline's run-state labels at the moment a
# tracker item closes, which is the only deterministic, session-free point at which they
# are known to be stale: the lane's milestone 5 requires an OPEN pr, so a session-side drop
# would fire while review is still in flight and the claimed label is correct.
#
# Unlike the read-only evidence workflow, this one WRITES: it removes the two run-state
# labels from one issue. That is the entire scope of the issues:write grant below.
#
# The committed check script resolves the label names from this repo's committed
# .claude/second-shift.config.json at run time, so nothing here is substituted at install
# and there is no rendered copy to drift. A tracker that declares it takes no writes, or
# one that is not github, makes the script a stated no-op.
#
# This file and the marketplace repo's own .github/workflows/unclaim-on-close.yml are a
# copy pair. The three blocks below that must not drift apart carry LOCKSTEP markers, which
# that repo's scripts/check-lockstep-pairs.sh discovers and compares.
#
# Model-free: no API-billed model calls, just jq + gh (both preinstalled on
# ubuntu-latest; gh authenticates via the built-in github.token).
name: second-shift unclaim
# LOCKSTEP-BEGIN unclaim-workflow-trigger
on:
  issues:
    types: [closed]
# LOCKSTEP-END unclaim-workflow-trigger

# A workflow `permissions:` block can only narrow the repo's maximum, never widen it. If
# Settings → Actions → Workflow permissions is "read repository contents", this grant is
# refused and the removal fails with HTTP 403 — a red run, not a silent no-op, so it is
# visible. Switch that setting to read-and-write to use this workflow.
# LOCKSTEP-BEGIN unclaim-workflow-permissions
permissions:
  contents: read
  issues: write
# LOCKSTEP-END unclaim-workflow-permissions

jobs:
  unclaim:
    name: second-shift unclaim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The issue number rides in the environment rather than being interpolated into the
      # run body — a `${{ }}` splice into a shell line is an injection surface.
      - name: release the run-state labels
        # LOCKSTEP-BEGIN unclaim-workflow-env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # LOCKSTEP-END unclaim-workflow-env
        run: bash .claude/tools/second-shift-unclaim.sh "$ISSUE_NUMBER"
