# install-topology — the class guard for #419, event-triggered rather than nightly (#666).
#
# WHAT THE CLASS GUARD GUARDS. A shipped suite can pass in this checkout and fail everywhere it
# is actually installed, because it silently borrows something from the tree it was authored
# in. tools/install-topology-selftest.sh stages every plugin into a version-keyed install cache
# outside any git repo, with cwd in a separate consumer directory, and re-runs every shipped
# suite from there. Two real defects motivated it, both green in-tree the whole time — see that
# script's own header for the full class.
#
# WHY NOT ON A CLOCK. This guard used to run nightly in nightly-guards.yml. Its own docs
# (docs/testing.md) already accepted within-a-day detection as the trade for keeping it off the
# PR lane, but a clock is the least relevant trigger for it: the guard's answer only moves when
# packaging/layout changes or a release is cut, and its red was rotting on a cron dashboard
# nobody here reads.
#
# TRIGGERS. Three, each answering "did the layout this guard reproduces just change":
#   - push to main, filtered to the packaging/layout paths below — a narrow filter, not
#     `plugins/**`: the goal is to stop firing once per merge, so it is deliberately blind to a
#     shipped suite's own content changing. That gap is real, not an oversight — see docs/testing.md
#     and CLAUDE.md for the honest statement of what it does and does not catch, and why the
#     release PR (below) is what actually closes it.
#   - the release PR (head branch `release/next`, and the head repo must be THIS repo — a fork
#     PR can name its branch release/next, same discipline as ci.yml's pr-gates release
#     exemption). A release ships every plugin at its own manifest version, which is exactly
#     the topology this guard reproduces, regardless of which paths that PR's own commits touch
#     — this is the trigger that actually re-runs every staged suite, filter or no filter.
#   - workflow_dispatch, for a branch under development that touches packaging or a suite.
#
# PATH FILTER (AC-3), each family named for what the guard actually stages, not for what it
# merely ships alongside:
#   - plugins/*/.claude-plugin/plugin.json — the guard reads THIS file's `version` to lay the
#     plugin out at <plugin>/<version>/ in the cache; editing it changes the key the topology
#     is staged under.
#   - tools/install-topology-selftest.sh — the guard's own staging/layout logic; changing HOW
#     it reproduces the install topology is a packaging/layout change by definition.
#   `.claude-plugin/marketplace.json` is deliberately NOT a family: the guard never reads it —
#   it iterates `plugins/*/` on disk directly (`tools/install-topology-selftest.sh`'s
#   `for plugin_dir in "$REPO"/plugins/*/`) — so listing it would assert a dependency the code
#   does not have. A shipped suite's own content is also NOT a family, for the same reason
#   `plugins/**` is off the table above: matching it would fire on every merge that touches any
#   plugin, which is the cron-frequency behavior this move exists to leave.
#
# ON RED: each guard job keeps its log and hands its `RED:` lines to file-issue-on-red as a job
# output. Job outputs are evaluated when a job completes, failed or not, so they exist while
# this run is still in progress; `gh run view --log-failed` does not (gh refuses logs until the
# whole run is complete). file-issue-on-red files one issue per red state: when one is already
# open it comments the new SHA, run and suites there instead of filing a duplicate.
#
# BOTH LANES. Several install-topology-known-red.tsv rows were explicitly environment-dependent
# historically, so the bash-3.2 copy carries signal ubuntu does not. Splitting by lane costs
# nothing — they run concurrently and block nothing.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'tools/install-topology-selftest.sh'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-topology:
    # Every push/workflow_dispatch run executes; a pull_request run executes only for the
    # release PR itself. Every OTHER pull_request event still triggers this workflow (path
    # filters do not apply to pull_request here — the release PR must run regardless of which
    # paths its own commits touch) but this job reports a no-op skip rather than a red.
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'release/next' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      red: ${{ steps.red.outputs.lines }}
    steps:
      - uses: actions/checkout@v5

      # The staged suites need both; this job stands alone, so it states its own tools.
      - name: install shellcheck + jq
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck jq

      # `shell: bash` runs with pipefail, so the guard's exit code survives the tee.
      - name: install-topology class guard
        shell: bash
        run: bash tools/install-topology-selftest.sh | tee "$RUNNER_TEMP/install-topology.log"

      - name: hand the RED lines to file-issue-on-red
        id: red
        if: failure()
        shell: bash
        run: |
          delim="RED_$(openssl rand -hex 16)"
          {
            echo "lines<<$delim"
            grep -E '^[[:space:]]*RED:' "$RUNNER_TEMP/install-topology.log" 2>/dev/null | sed -E 's/^[[:space:]]*//' || true
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  install-topology-bash32:
    name: install-topology (macos, bash 3.2)
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'release/next' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    outputs:
      red: ${{ steps.red.outputs.lines }}
    steps:
      - uses: actions/checkout@v5

      # macOS ships /bin/bash 3.2 and every shipped script claims 3.2 compat, but GitHub's macOS
      # runners put Homebrew bash 5 first on PATH — so shim PATH to force `#!/usr/bin/env bash`
      # back to the stock binary. Same idiom as ci.yml's selftests-bash32-shard job.
      - name: install-topology class guard under stock bash 3.2
        shell: bash
        run: |
          mkdir -p /tmp/bash32
          ln -sf /bin/bash /tmp/bash32/bash
          export PATH="/tmp/bash32:$PATH"
          bash --version | head -1
          bash tools/install-topology-selftest.sh | tee "$RUNNER_TEMP/install-topology.log"

      - name: hand the RED lines to file-issue-on-red
        id: red
        if: failure()
        shell: bash
        run: |
          delim="RED_$(openssl rand -hex 16)"
          {
            echo "lines<<$delim"
            grep -E '^[[:space:]]*RED:' "$RUNNER_TEMP/install-topology.log" 2>/dev/null | sed -E 's/^[[:space:]]*//' || true
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  # `always()` because the default `needs` gate would otherwise skip this job the moment either
  # upstream job fails.
  file-issue-on-red:
    needs: [install-topology, install-topology-bash32]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: comment on the open red, or file one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          UBUNTU_RESULT: ${{ needs.install-topology.result }}
          BASH32_RESULT: ${{ needs.install-topology-bash32.result }}
          UBUNTU_RED: ${{ needs.install-topology.outputs.red }}
          BASH32_RED: ${{ needs.install-topology-bash32.outputs.red }}
        run: |
          set -euo pipefail

          lane_section() {
            local lane="$1" result="$2" red="$3"
            [[ "$result" == "failure" ]] || return 0
            echo "**$lane**"
            echo
            if [[ -n "$red" ]]; then
              echo '```'
              echo "$red"
              echo '```'
            else
              echo "No \`RED:\` line: the lane failed before the guard reached a verdict. Read the run log."
            fi
            echo
          }

          BODY="$(mktemp)"
          {
            echo "The install-topology class guard failed on \`${SHA:0:12}\`."
            echo
            echo "Run: https://github.com/$GH_REPO/actions/runs/$RUN_ID"
            echo
            lane_section "install-topology (ubuntu)" "$UBUNTU_RESULT" "$UBUNTU_RED"
            lane_section "install-topology-bash32 (macos, bash 3.2)" "$BASH32_RESULT" "$BASH32_RED"
          } > "$BODY"

          # Dedup by title substring, not a label: a label has to pre-exist in the repo or
          # `gh issue create --label` errors outright, and the title is already the natural key.
          existing="$(gh issue list --search 'is:open "install-topology guard red" in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$BODY"
            exit 0
          fi

          gh issue create \
            --title "install-topology guard red @ ${SHA:0:12}" \
            --body-file "$BODY"
