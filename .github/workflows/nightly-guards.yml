# Nightly standing guards — model-free, like every other lane here.
#
#   wholesale-selftests  the whole sweep on a schedule. It is the one sweep that runs when no
#                        push or PR does, so it catches a red caused by a moved runner image
#                        rather than by a change to the tree. Its unique contribution over
#                        install-topology (see below) is the suites that ship with no plugin —
#                        those under tools/, scripts/ and tests/.
#
# install-topology used to run here too, on this same cron. #666 moved it to
# .github/workflows/install-topology.yml on event triggers (push on packaging paths, the
# release PR, workflow_dispatch): a clock is the least relevant trigger for a guard whose
# answer only moves when packaging/layout changes or a release is cut, and its red was
# rotting on a cron dashboard nobody here reads. See that file for the class it guards and
# why both a ubuntu and a bash-3.2 lane run it.
#
# wholesale-selftests has ONE lane, deliberately: ci.yml's selftests-bash32 already runs the
# whole sweep under stock bash 3.2 at PR time. The macos twin was deleted 2026-08-30.
name: nightly-guards

on:
  schedule:
    # 02:41 UTC — off the hour.
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # IT MUST ASK THE PR LANE'S QUESTION, exactly. Same `--exclude` (install-topology.yml's guard
  # already re-runs that suite), and the same SKIP_STRESS asymmetry as ci.yml — unset on ubuntu,
  # '1' on macos. A backstop running a different question is not a backstop.
  wholesale-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags: derive-release's suite diffs against the latest release tag

      - name: install shellcheck + jq
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck jq

      - name: wholesale selftest sweep
        run: bash tools/run-selftests.sh --full --exclude tools/install-topology-selftest.sh

