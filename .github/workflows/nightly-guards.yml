# Nightly standing guards — model-free, like every other lane here.
#
# ONE GUARD, one cron: wholesale-selftests is a STANDING MEASUREMENT whose answer barely moves
# from one PR to the next, and costs more than that answer is worth on the critical path.
# prose-budget rides the same cron for the same reason, at a fraction of the cost.
#
#   wholesale-selftests  the whole sweep with the pass cache BYPASSED (#448). The PR lane skips a
#                        suite whose declared inputs in tools/selftest-cache-inputs.tsv are
#                        unchanged; this leg is the backstop that catches an UNDER-declaration,
#                        within a day, against a tree nobody is waiting on. Its unique
#                        contribution over install-topology (see below) is the suites that ship
#                        with no plugin — those under tools/, scripts/ and tests/.
#
# install-topology used to run here too, on this same cron. #666 moved it to
# .github/workflows/install-topology.yml on event triggers (push on packaging paths, the
# release PR, workflow_dispatch): a clock is the least relevant trigger for a guard whose
# answer only moves when packaging/layout changes or a release is cut, and its red was
# rotting on a cron dashboard nobody here reads. See that file for the class it guards and
# why both a ubuntu and a bash-3.2 lane run it.
#
# This file was `install-topology.yml` until wholesale-selftests landed; every job here runs
# concurrently and blocks nothing. wholesale-selftests has ONE lane, deliberately (same reasoning
# as prose-budget below): ci.yml's selftests-bash32 already runs the whole sweep under stock bash
# 3.2 at PR time, and the pass cache this backstop exists to bypass covers exactly the suites in
# tools/selftest-cache-inputs.tsv — a 3.2 twin here re-ran the same code path to re-ask a
# question the ubuntu lane already answers. The macos twin was deleted 2026-08-30.
name: nightly-guards

on:
  schedule:
    # 02:41 UTC — off the hour, and clear of the 03:17 mutation sweep so the two standing
    # measurements do not contend for runners.
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pass cache's backstop (#448). NO --cache-dir, so nothing is skipped and no marker is
  # written: an under-declared input set that let the PR lane skip a suite is caught here, red,
  # by the suite failing wholesale.
  #
  # IT MUST ASK THE PR LANE'S QUESTION, exactly. Same `--exclude` (install-topology.yml's guard
  # already re-runs that suite), and the same SKIP_STRESS asymmetry as ci.yml — unset on ubuntu,
  # '1' on macos. A backstop running a different question is not a backstop.
  wholesale-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags: derive-release's suite diffs against the latest release tag

      - name: install shellcheck + jq
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck jq

      # pipefail, because the capture is what the bound check reads and `tee` would otherwise
      # report ITS exit code — a red sweep would leave this step green.
      - name: wholesale selftest sweep, cache bypassed
        run: |
          set -o pipefail
          bash tools/run-selftests.sh --full --exclude tools/install-topology-selftest.sh 2>&1 \
            | tee "$RUNNER_TEMP/sweep.log"

      # THE ONE EXECUTION SURFACE (#629). Not the PR lane: a PR runner is noisier and a single
      # slow-end sample would red an honest PR. Not the macos twin either — the baseline is one
      # committed number, and two machine classes checked against it would make it meaningless
      # for both. It runs after the sweep and only when the sweep was green: a red sweep is the
      # headline, and its timings describe a tree that failed.
      - name: un-deferred sweep bound
        run: bash tools/check-sweep-bound.sh --log "$RUNNER_TEMP/sweep.log"

  # The prose narrative check (#552; reshaped by #641, #719). It reports the instruction layer's
  # size and flags narrative `#NNN` incident archaeology; it reds only on vacuous coverage (a scan
  # root that exists but matched nothing). #641 deleted the word-count-vs-baseline ratchet on both
  # axes, and #719 deleted the shell-mass guard that had taken over the shell half — so there is
  # no ceiling left to grow past, on either axis. It is ADVISORY TO THE LEAN LANE — build-lean
  # never runs it and a red here blocks no PR — but "advisory" scopes the lane, not CI, so this
  # job reds like every other guard in this file.
  #
  # ONE LANE, deliberately. ci.yml's selftests-bash32 already runs the whole sweep, including
  # prose-budget-selftest.sh, under stock bash 3.2 at PR time. A 3.2 twin here would re-run the
  # same code path over different data.
  prose-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: instruction-layer narrative check
        run: bash plugins/dev-pipeline/tools/prose-budget.sh
