# Release the pipeline's run-state labels when a tracker item closes (#423).
#
# The claimed label is added at claim and used to be removed by nothing: the lane's step-9
# prose said the session drops it, but the lean lane's milestone 5 requires an OPEN pr, so it
# runs strictly pre-merge — the one moment the label is still correct. The stale window
# opens at merge, when the pr's closing reference closes the issue and no session is
# running to notice. Binding the release to the close event is deterministic, needs no
# live session, and covers both lanes plus a hand-closed issue.
#
# This repo is the canary, so the job runs the SHIPPED template script in place rather
# than a committed copy under .claude/tools/ — one script, and what runs here is exactly
# what a consumer receives. The two workflow FILES are still a copy pair, so the three
# blocks they must not drift on carry LOCKSTEP markers; the rows live in
# scripts/lockstep-manifest.tsv. Everything outside them (name, checkout pin, script path)
# is free to differ.
#
# Model-free: no API-billed model calls, just jq + gh (both preinstalled on
# ubuntu-latest; gh authenticates via the job token).
#
# TRIGGER CAVEAT. GitHub suppresses event cascades for activity attributed to GITHUB_TOKEN,
# so an issue closed by a merge an automation performed could reach closed without firing a
# run. Merges here are maintainer-attributed, so the dominant path is expected to fire — but
# an `issues` workflow only runs from the default branch, so this cannot be proven before it
# merges. If a close is ever seen with no run, the reversal is additive: add
# `pull_request: [closed]` as a second trigger and resolve the issue number from the pr body.
name: unclaim on close
# LOCKSTEP-BEGIN unclaim-workflow-trigger
on:
  issues:
    types: [closed]
# LOCKSTEP-END unclaim-workflow-trigger

# issues:write is the whole point of this workflow and its entire blast radius: the job
# removes the two run-state labels from one issue. contents:read is for the checkout that
# supplies the script. Never widen either. Note a `permissions:` block only NARROWS the
# repo maximum — with Actions workflow permissions set to read-only this grant is refused
# and the removal 403s, which the script surfaces as a red run rather than a silent pass.
# LOCKSTEP-BEGIN unclaim-workflow-permissions
permissions:
  contents: read
  issues: write
# LOCKSTEP-END unclaim-workflow-permissions

jobs:
  unclaim:
    name: release the run-state labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The issue number rides in the environment, never spliced into the run body — the
      # same injection discipline ci.yml applies to BASE_REF and the PR_* set.
      - name: release the run-state labels
        # LOCKSTEP-BEGIN unclaim-workflow-env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # LOCKSTEP-END unclaim-workflow-env
        run: bash plugins/second-shift/templates/consumer/second-shift-unclaim.sh "$ISSUE_NUMBER"
