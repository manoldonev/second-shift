# Model-free CI (design principle: subscription-first — no API-billed model calls in CI).
name: ci
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref. Every job here is a pure verifier of the tree at a commit — nothing
# deploys, nothing publishes — so a superseded run's verdict is about a commit no reviewer will
# read, and letting it finish only queues behind the run that matters. Keyed on `github.ref`, so
# a push to one PR cancels that PR's run and nothing else's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags: selftests (derive-release) diff against the latest release tag

      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y shellcheck jq
          # SC1091: sourced files resolved at runtime
          # SC2015: `A && B || C` guard style is the tree's deliberate idiom (57 sites)
          # SC2181: selftests check `$?` after run_cli-style wrappers deliberately (the
          #         command under test is a variable invocation, not inlineable)
          find . -name '*.sh' -type f -print0 | xargs -0 shellcheck -e SC1091,SC2015,SC2181

      - name: validate JSON (manifests, schema, fixtures)
        run: find . -name '*.json' -type f -print0 | xargs -0 -n1 jq empty

      # GitHub renders .github/ISSUE_TEMPLATE/*.yml against its own issue-forms/issue-config
      # JSON Schemas at PR-merge time — tests/issue-forms-selftest.sh proves well-formedness
      # plus a hand-written required-field table, but neither catches an illegal `type:`, a
      # misplaced key, a bad `render:` language, or a malformed `id`; those only ever surfaced
      # after merge (#299). check-jsonschema ships both schemas as builtin ids, pinned via
      # pipx (preinstalled on the runner image) rather than `pip install --user` — PEP 668
      # marks ubuntu-24.04's system Python externally-managed. Same posture as the pinned
      # actionlint image below: pinned, no curl|bash.
      - name: issue-forms schema validation (check-jsonschema, pinned)
        run: |
          pipx install --quiet check-jsonschema==0.37.4
          # pipx's shim dir is not guaranteed on PATH for a non-login `run:` shell — state it
          # explicitly rather than relying on the runner image's default PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # Confirm the pin still exposes both builtin ids the step below depends on, ahead
          # of using them — the whole point of pinning is that this can't silently drift.
          for schema_id in vendor.github-issue-forms vendor.github-issue-config; do
            if ! check-jsonschema --help | grep -q "$schema_id"; then
              echo "::error::check-jsonschema 0.37.4 no longer exposes builtin schema '$schema_id' — pin a version that does."
              exit 1
            fi
          done

          check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml

          # Glob, not a named list: a new form is validated on arrival with no workflow edit.
          shopt -s nullglob
          forms=(.github/ISSUE_TEMPLATE/*.yml)
          for f in "${forms[@]}"; do
            [[ "$(basename "$f")" == "config.yml" ]] && continue
            check-jsonschema --builtin-schema vendor.github-issue-forms "$f"
          done

          # Rejection assertion: this step must FAIL if the validator ACCEPTS a checked-in
          # bad fixture — proof the gate can actually go red, not just green on real forms.
          fixture_fails=0
          fixtures=(tests/issue-forms-fixtures/*.yml)
          for f in "${fixtures[@]}"; do
            if check-jsonschema --builtin-schema vendor.github-issue-forms "$f" >/dev/null 2>&1; then
              echo "::error::fixture $f was ACCEPTED by the schema — it must be rejected"
              fixture_fails=$((fixture_fails+1))
            fi
          done
          exit "$fixture_fails"

      # Static analysis of the workflow files themselves: invalid `if:` expressions, unknown
      # contexts, bad `uses:` refs, plus shellcheck over `run:` blocks. Pinned image, no
      # curl|bash. NOTE the chicken-and-egg: a YAML *syntax* error in this very file means
      # GitHub refuses to run it, so this step never fires for its own breakage — that floor
      # is held locally by scripts/check-workflows-selftest.sh, which is the gate that must
      # catch it before the push.
      - name: actionlint (workflow static analysis)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      # tools/run-selftests.sh, not an inline loop: CLAUDE.md's Verification section mandates
      # `-P 4` and measures it at 13:12 serial vs 5:22 parallel, and this step was running the
      # exact serial form the repo tells contributors not to run — 709s of a 771s job. The
      # runner exists rather than a bare `-P` flag because at -P 4 the suites' raw stdout
      # braids together; it captures each suite and replays it inside ::group:: framing.
      #
      # install-topology-selftest.sh is EXCLUDED here. There is no job for it in this workflow:
      # it runs on a nightly cron in .github/workflows/nightly-guards.yml, and the note above
      # the release-time derivation gates below says why. It re-runs every shipped suite from a
      # staged install cache, so leaving it in this sweep has it contending with the very suites
      # it duplicates (the then-slowest suite measured at 244s against a ~94s uncontended norm). It stays
      # DISCOVERED — the exclusion names a path that must exist, and the runner hard-errors if
      # it ever stops matching.
      # The pass cache (#448). Restore is unconditional; SAVE is push-only, and so is the
      # runner's own --cache-write, which is belt-and-braces on purpose: GitHub already scopes a
      # PR-created cache to that PR's branch, but the runner flag is what makes "a PR cannot
      # record its own untested content as a pass" an assertion in tools/run-selftests-selftest.sh
      # rather than a property only GitHub can demonstrate.
      - name: restore selftest pass cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/selftest-cache
          key: selftest-pass-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            selftest-pass-${{ runner.os }}-

      - name: run all selftests
        run: |
          args=(--full --exclude tools/install-topology-selftest.sh --cache-dir "$RUNNER_TEMP/selftest-cache")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--cache-write)
          fi
          bash tools/run-selftests.sh "${args[@]}"

      # `if: success()` is explicit rather than implied: a cache saved after a red sweep would
      # carry forward the passes of a run whose verdict was never green, and the next PR would
      # be served them.
      - name: save selftest pass cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/selftest-cache
          key: selftest-pass-${{ runner.os }}-${{ github.run_id }}

      # Contract blocks duplicated across files (an agent's inline copy of a rule, a schema
      # three Workflow scripts each redeclare) where prose alone said "keep verbatim".
      # Replaces the deleted prose-presence guards: byte-parity beats token presence.
      # The markers in the files are the whole declaration — the checker discovers and groups
      # them, so this step takes no register argument and an anchor with ONE site fails (#604).
      - name: contract lockstep blocks (discovered from LOCKSTEP markers)
        run: bash scripts/check-lockstep-pairs.sh

      # No vendor model identity in the runnable eval surface under plugins/*/evals/**. The
      # eval harnesses are operator-run and model-billed; CI never invokes them and this step
      # does not either — it is a static text scan, so the model-free-CI principle holds.
      - name: eval-harness model identity (plugins/*/evals/**)
        run: bash scripts/check-eval-model-identity.sh

      # Staged-lane capabilities and their recorded dispositions. Same class as the lockstep
      # step above — a register whose guard needs an explicit invocation, because the paired
      # selftest is glob-discovered but only proves the guard works, never runs it against the
      # real register. This step is the gate on #348's deletions: a stage doc no row names
      # cannot land.
      - name: capability parity register (tools/capability-parity.tsv)
        run: bash tools/capability-parity-check.sh

      - name: namespace direction check (docs/namespaces.md rule 3)
        run: |
          # Array, not a space-separated string: the multi-dir expansion is intentional, and
          # "${TOOLKITS[@]}" expresses that without tripping shellcheck's SC2086 (which
          # actionlint runs over every `run:` block).
          TOOLKITS=(plugins/review-toolkit plugins/intake-toolkit plugins/design-toolkit plugins/audit-toolkit)
          # (a) no dev-pipeline: namespace token anywhere in the four toolkits
          if grep -rn 'dev-pipeline:' "${TOOLKITS[@]}" --include='*.md' --include='*.mjs' --include='*.sh' --include='*.json' 2>/dev/null; then
            echo "::error::rule 3(a): a toolkit references the dev-pipeline: namespace"; exit 1
          fi
          # (b) no hard dev-pipeline/ PATH reference in toolkit CONTENT (skills + agents).
          #     Workflows are invoked by bare filename (D-15).
          #     Validator/eval tools that resolve
          #     the sibling dev-pipeline plugin are exempt — they live under scripts/ and evals/,
          #     which are excluded here (grep the toolkit roots directly so paths are never empty).
          if grep -rnE 'dev-pipeline/(workflows|model-tiering)|\.\./dev-pipeline/' \
               "${TOOLKITS[@]}" --include='*.md' --include='*.mjs' --exclude-dir=scripts --exclude-dir=evals 2>/dev/null; then
            echo "::error::rule 3(b): toolkit content hard-paths into dev-pipeline (invoke workflows by bare filename; reference artifacts by name)"; exit 1
          fi

  # Test-the-tests, diff-scoped. Mutates only the guards this PR touches and runs their
  # paired selftests; a mutant that SURVIVES is a regression the suite would not have caught.
  # Guards whose kill set is not a single fast suite defer to the nightly wholesale sweep
  # rather than being graded against a weaker criterion than the one that produced the baseline.
  #
  # ITS OWN JOB, not a step of lint-and-selftests: it was serialized behind ~12 minutes of
  # selftests while carrying its own 15-minute timeout, so on a guard-touching PR it put ~10
  # more minutes on the critical path for no dependency reason. Nothing it reads is produced by
  # that job.
  #
  # pull_request only: no base ref exists on push-to-main. BASE_REF rides in the environment for
  # the same injection reason as pr-gates below. SKIP_STRESS is the canonical sweep environment
  # and is set here, on this job alone — the selftest job above must keep exercising the stress
  # legs, and the harness never exports it itself (that would make the baseline's environment
  # check vacuous).
  mutation-sweep-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the sweep diffs the PR against its base to scope the guard set

      # The paired selftests this sweep runs need both. They were previously inherited from
      # lint-and-selftests' shellcheck step; standing alone, this job states its own tools.
      - name: install shellcheck + jq
        run: sudo apt-get update -q && sudo apt-get install -y shellcheck jq

      - name: mutation sweep (PR-scoped)
        timeout-minutes: 15
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP_STRESS: '1'
        run: bash tools/mutation-sweep.sh --mode pr --base "origin/$BASE_REF"

  # The install-topology class guard does NOT run here. It lives in .github/workflows/
  # nightly-guards.yml on a nightly cron (plus workflow_dispatch), because its cost IS the
  # shipped suite set run a second time — the repo's longest job — while the class it guards
  # only moves when suites or packaging change. Both selftest jobs exclude it by path, and the
  # runner hard-errors if that path ever stops matching, so it cannot silently fall out of the
  # nightly's reach either.
  #
  # Release-time derivation (#119): feature PRs must NOT write the release-owned files —
  # plugin.json version fields and CHANGELOG.md are computed on the release PR by
  # scripts/derive-release.sh. These two gates are pull_request-only and skip the release
  # branch (release/next), which is the one legitimate writer.
  # The release-branch exemption is keyed on branch name AND head repo: `head_ref` alone is
  # chosen by the PR author (a fork can name its branch release/next), so name-only routing
  # would let any contributor skip both guards. A fork PR is ALWAYS a feature PR here.
  pr-gates:
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'release/next' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # A `permissions:` key REPLACES the defaults wholesale, so `contents: read` must be
    # restated or actions/checkout breaks. issues/pull-requests are for the chain check's comment
    # reads — the PR's marker trail, and the issue's claim trail, which carries both the build
    # identity and the producer capability stamp the bound arms gate on.
    # Gaining a scope here is a question about the CONSUMER template too. If the arm needing it
    # lives in the delegated payload (lean-evidence.sh), then
    # plugins/second-shift/templates/consumer/second-shift-ci.yml needs the same scope, and
    # without it every adopting repo's lean PRs red on an environment error. If it lives only in
    # check-lean-chain.sh, the template must NOT get it — an unused scope there is a standing
    # escalation for a job that executes a fetched script. Reasoned out in docs/testing.md
    # (the `lean evidence TOKEN SCOPES` entry under *Couplings considered and declined*).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # CI-visible copies of two runtime-config values. The runtime config
    # (.claude/second-shift.config.json) is gitignored and absent in CI, so these constants
    # are the only source available here — and NOTHING reconciles them against it. A stale
    # prefix matches zero branches and silently exempts every PR, which is why the check
    # treats an unset/empty constant as fatal rather than not-applicable, and why it echoes
    # the resolved prefix on every not-applicable verdict. Residual risk is recorded in
    # docs/pipeline-manifesto.md's T0 note.
    env:
      # ONE namespace for both lanes (#413) — the lean harness cuts `<branchPrefix><key>`
      # branches too, so the separate LEAN_BRANCH_PREFIX constant that used to sit here is
      # retired. Neither chain gate classifies on the branch name any more: both delegate to
      # lean-evidence.sh, which reads the committed lean spec in the PR's own diff.
      PIPELINE_BRANCH_PREFIX: claude/second-shift-
      PIPELINE_PLAN_PATTERN: docs/plans/acme-{issueKey}.md
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # BASE_REF rides in the environment, never spliced into the run body: git ref names
      # permit $, backticks and ; so `${{ }}` interpolation into a shell line is injectable.
      - name: frozen files guard (plugin.json versions + CHANGELOG are release-owned)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-frozen-files.sh "origin/$BASE_REF"

      - name: "changelog trailer guard (plugins/** PRs carry a Changelog: trailer)"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-changelog-trailer.sh "origin/$BASE_REF"

      # #641: guard/test shell mass stays under a ceiling that only ever ratchets down. Same
      # env-not-interpolation discipline as BASE_REF above.
      - name: guard budget guard (guard/test shell mass stays under the ratcheting ceiling)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-guard-budget.sh "origin/$BASE_REF"

      # T2 rung 1: a pipeline-authored PR must carry a complete, single-family, key-consistent
      # stage trail as of PR open. Same env-not-interpolation discipline as BASE_REF above,
      # and it matters more here: a PR body is far more attacker-controllable than a ref name.
      #
      # PIPELINE_COMMENT_AUTHOR is deliberately NOT set. The check already restricts the trail
      # to `user.type == "Bot"`, which is what closes the drive-by-comment attack (this repo is
      # public, so anyone can comment on an issue). Pinning the exact bot login would only
      # additionally exclude *other* GitHub Apps, and it would write an app identity into a
      # committed file plus add a third constant that can go stale. Set it if that trade flips.
      #
      # PR_BASE_REF and PR_HEAD_SHA are additional to the PR_* set the stage-trail arms need:
      # this check now delegates its lean exclusion to lean-evidence.sh (#413), which reads the
      # PR's CHANGED FILES and therefore needs a base to diff against. Without them the
      # classifier sees an empty diff, reports every lean PR as non-lean, and this gate reds it
      # on a stage trail the lean lane never emits. Same head-commit discipline as the lean
      # gate's step below.
      - name: pipeline chain reconciliation (pipeline-authored PRs carry a complete stage trail)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: bash scripts/check-pipeline-chain.sh

      # The lean harness's own merge-boundary gate. A SIBLING of the check above, not a mode of
      # it: the two read different evidence sets. They no longer cover disjoint branch
      # NAMESPACES — #413 put both lanes on `<tracker.branchPrefix><key>` — so what keeps exactly
      # one of them claiming a PR is the committed lean spec, and both resolve that through the
      # SAME classifier (lean-evidence.sh) rather than by two agreeing implementations.
      #
      # PR_BASE_REF is load-bearing for both steps, not a convenience: the classifier's sole
      # applicability arm scans the PR's changed files, which needs a base to diff against, and
      # it exits 2 rather than reporting "not lean" when it cannot. Dropping this key reds both
      # gates instead of silently exempting the PR from them. Same env-not-interpolation
      # discipline throughout.
      #
      # PR_HEAD_SHA is the freshness check's measuring point and must be the HEAD COMMIT, not
      # `HEAD`: on a pull_request event actions/checkout resolves refs/pull/N/merge, so HEAD is
      # merge(base, head) and every base-side commit merged since the branch point would read
      # as "changed after the verdict". fetch-depth: 0 above is what makes the object reachable.
      #
      # PR_NUMBER is the delegated payload's input, not this script's: the build run's identity
      # is a bot marker comment on the PR, and the arm reading it fetches that trail by number.
      # Absent, the payload exits 2 and this gate propagates it — a check that cannot run is
      # never scored as a pass, so dropping this constant reds every lean PR rather than
      # quietly waiving the authorship comparison.
      - name: lean chain reconciliation (lean PRs carry their evidence set)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-lean-chain.sh

  # Gates that run ONLY on the release PR: the old version-bump discipline (every
  # content-changed plugin carries its derived bump — same script, new call site) and the
  # configVersion migration-doc gate (a schema-breaking change ships its upgrade doc).
  release-pr-gates:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'release/next' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: bump discipline (changed plugin ⇒ derived bump applied)
        run: bash scripts/check-plugin-version-bumps.sh

      - name: configVersion migration-doc gate
        run: bash scripts/check-configversion-migration-doc.sh

  # macOS ships /bin/bash 3.2 and every shipped script claims 3.2 compat — two real bugs
  # (a generator mapfile, a mark-failed brace-default expansion) lived undetected while the
  # selftests only ever ran under bash 4+. GitHub macOS runners put Homebrew bash 5 first on
  # PATH, so shim PATH to force `#!/usr/bin/env bash` back to the stock 3.2 binary. (Ported
  # from the acme vendored-era workflow, widened from one suite to the full selftest set.)
  selftests-bash32:
    name: selftests (macos, bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Same runner and the same exclusion as the ubuntu lane — see its step for why both.
      # `SKIP_STRESS: '1'` here and NOT on the ubuntu lane is today's deliberate asymmetry,
      # preserved: the stress legs run once, under bash 4+.
      #
      # The runner is bash-3.2 compatible by construction (no `wait -n`, no associative arrays
      # on the dispatch path) — the xargs-over-indices idiom is lifted from
      # install-topology-selftest.sh, which already runs under this shim.
      # Same pass-cache wiring as the ubuntu lane. The two lanes never share a marker: the key
      # carries RUNNER_OS and the bash major, so a 3.2 verdict is never served to a 5.x run.
      - name: restore selftest pass cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/selftest-cache
          key: selftest-pass-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            selftest-pass-${{ runner.os }}-

      - name: run all selftests under stock bash 3.2
        env:
          # Parallel-write stress cases are documented as too flaky for CI.
          SKIP_STRESS: '1'
        run: |
          mkdir -p /tmp/bash32
          ln -sf /bin/bash /tmp/bash32/bash
          export PATH="/tmp/bash32:$PATH"
          bash --version | head -1
          args=(--full --exclude tools/install-topology-selftest.sh --cache-dir "$RUNNER_TEMP/selftest-cache")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--cache-write)
          fi
          bash tools/run-selftests.sh "${args[@]}"

      - name: save selftest pass cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/selftest-cache
          key: selftest-pass-${{ runner.os }}-${{ github.run_id }}
